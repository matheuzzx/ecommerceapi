name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build and run tests (incl. Testcontainers)
        run: ./gradlew test --no-daemon

      - name: Build Docker image
        run: docker build -t commerceapi:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag commerceapi:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/commerceapi:${{ github.sha }}
          docker tag commerceapi:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/commerceapi:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/commerceapi:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/commerceapi:latest