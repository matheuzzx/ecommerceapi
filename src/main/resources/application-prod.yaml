# Perfil de producao: configuracoes obrigatorias via variaveis de ambiente.
# Sem os valores definidos, a aplicacao falha ao iniciar (fail-fast) — comportamento desejado em producao.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  checkout-url: ${PAYMENT_CHECKOUT_URL}

app:
  admin:
    auto-create: false

  categories:
    auto-create: false