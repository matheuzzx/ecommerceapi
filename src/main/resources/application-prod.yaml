# Perfil usado pela stack completa do Docker Compose.
# Conexao, segredos e CORS sao obrigatorios via variaveis de ambiente.
# Admin e categorias de demonstracao permanecem ativos por heranca do application.yaml.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  checkout-url: ${PAYMENT_CHECKOUT_URL}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
