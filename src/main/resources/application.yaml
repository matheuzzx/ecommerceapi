# Perfil padrão (desenvolvimento local).
# Overrides de produção: application-prod.yaml.
# Ative com SPRING_PROFILES_ACTIVE=prod ou --spring.profiles.active=prod
spring:
  application:
    name: commerceapi
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    driver-class-name: org.postgresql.Driver
    username: myuser
    password: mysecretpassword
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

jwt:
  secret: dGhpcy1pcy1hLXNlY3JldC1rZXktd2l0aC0zMi1ieXRlcy1mb3Itand0LWNvcnJlY3QteWVz
  expiration: 86400000

payment:
  webhook-secret: webhook-secret-simulado
  checkout-url: http://localhost:8080/checkout

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  admin:
    auto-create: true
    name: Administrador
    email: admin@admin.com
    password: Admin123!

  categories:
    auto-create: true

management:
  endpoints:
    web:
      exposure:
        include: health
